[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gxrag-api"
version = "0.1.0"
description = "FastAPI backend for the gxRag platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "redis>=5.0.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.28.0",
  "pypdf>=5.0.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pip-audit>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --show-capture=no"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E701", "E702", "E501", "B008", "E731", "B905"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
"app.db" = ["migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
