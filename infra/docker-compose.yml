services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gxrag}
      POSTGRES_USER: ${POSTGRES_USER:-gxrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gxrag}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  arangodb:
    image: arangodb:3.12
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGODB_ROOT_PASSWORD:-gxrag}
    volumes:
      - arangodb_data:/var/lib/arangodb3

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeThisLocalOnly123!}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      GXRAG_REDIS_URL: redis://redis:6379/0
      GXRAG_VECTOR_DATABASE_URL: postgresql://gxrag:gxrag@postgres:5432/gxrag
      GXRAG_OPENSEARCH_URL: http://opensearch:9200
      GXRAG_ARANGODB_URL: http://arangodb:8529
    ports:
      - "8000:8000"
    depends_on: [postgres, redis, arangodb, opensearch]

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      GXRAG_REDIS_URL: redis://redis:6379/0
      GXRAG_VECTOR_DATABASE_URL: postgresql://gxrag:gxrag@postgres:5432/gxrag
      GXRAG_OPENSEARCH_URL: http://opensearch:9200
      GXRAG_ARANGODB_URL: http://arangodb:8529
    depends_on: [api, redis]

volumes:
  postgres_data:
  arangodb_data:
  opensearch_data:
