name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GXRAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "apps/api[dev]" -e apps/worker
      - run: ruff check apps/api
        name: lint
      - run: python -m pytest
        name: tests (unit, isolation, RBAC, database)
        working-directory: apps/api
      - run: python -m eval.run --json eval-report.json
        name: retrieval / graph / citation quality gate
        working-directory: apps/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: apps/api/eval-report.json
          if-no-files-found: ignore

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "libs/sdk-py[dev]"
      - run: python -m pytest
        working-directory: libs/sdk-py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: end-to-end (api + worker + postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      GXRAG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      GXRAG_REDIS_URL: redis://localhost:6379/0
      GXRAG_ENVIRONMENT: staging
      GXRAG_AUTH_MODE: jwt
      GXRAG_JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1
      GXRAG_ARTIFACT_ROOT: ${{ runner.temp }}/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e apps/api -e apps/worker
      - run: python -m app.db.migrate --seed
        working-directory: apps/api
      - name: start api and worker
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup python -m worker.main > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/v1/ready && break; sleep 1; done
      - run: python scripts/smoke.py http://localhost:8000
        working-directory: apps/api
      - if: failure()
        run: tail -n 50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/worker.log"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python dependency audit
        run: |
          pip install -U pip setuptools pip-audit
          pip install -e apps/api -e apps/worker -e libs/sdk-py
          pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: node dependency audit
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t gxrag-api:ci .
      - run: docker build -f apps/worker/Dockerfile -t gxrag-worker:ci .
      - name: container runs migrations module
        run: docker run --rm gxrag-api:ci python -c "from app.db.migrate import MIGRATIONS_DIR; assert list(MIGRATIONS_DIR.glob('*.sql'))"
